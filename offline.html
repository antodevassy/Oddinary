<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>You're Offline - Oddinary</title>
  <meta name="description" content="You are currently offline, but you can still play active Oddinary word imposter games on a single phone!">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="assets/fav-icon.png">
  <link rel="apple-touch-icon" href="assets/fav-icon.png">
  <meta name="theme-color" content="#07080A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body {
      overflow-x: hidden;
      max-width: 100%;
      width: 100%;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background-color: #07080A;
      color: #F2F2F2;
    }
    .offline-card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .offline-icon-wrapper {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: rgba(107, 207, 45, 0.12);
      border: 2px solid var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(107, 207, 45, 0.25);
    }
    .offline-title {
      font-size: 1.9rem;
      font-weight: 900;
      color: var(--primary);
      margin: 0;
      letter-spacing: 0.5px;
    }
    .offline-subtitle {
      color: var(--text-sec);
      font-size: 0.96rem;
      line-height: 1.6;
      margin: 0;
    }
    .offline-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="offline-card">
    <div class="offline-icon-wrapper">
      <svg viewBox="0 0 24 24" style="width:40px; height:40px; fill:var(--primary);"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L3.56 19.04c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.41-1.41C7.93 20.26 9.88 21 12 21c4.97 0 9-4.03 9-9 0-2.12-.74-4.07-1.97-5.61l1.41-1.41c.39-.39.39-1.02 0-1.41-.39-.39-1.02-.39-1.41 0l-1.41 1.41C16.07 3.74 14.12 3 12 3zm0 2c1.61 0 3.09.53 4.29 1.43L6.43 16.29C5.53 15.09 5 13.61 5 12c0-3.87 3.13-7 7-7zm0 14c-1.61 0-3.09-.53-4.29-1.43l9.86-9.86c.9 1.2 1.43 2.68 1.43 4.29 0 3.87-3.13 7-7 7z"/></svg>
    </div>

    <h1 class="offline-title">You're Offline</h1>
    <p class="offline-subtitle">
      No internet connection detected. Don't worry — you can still pass and play active games offline on this phone!
    </p>

    <div class="offline-actions">
      <a href="play.html" class="btn btn-primary" aria-label="Play offline now">
        PLAY OFFLINE NOW
      </a>
      <button class="btn" onclick="window.location.reload();" aria-label="Retry connection">
        Retry Connection
      </button>
    </div>
  </div>

  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
